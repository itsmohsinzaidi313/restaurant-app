<mat-list style="display: flex; gap: 10px; flex-direction: column;">
    @for (item of menuItems$ | async; track item.id) {
    <mat-list-item>
        <mat-icon matListItemIcon>arrow_right</mat-icon>
        <div matListItemTitle>{{item.name.toUpperCase()}}</div>
        <div matListItemLine>{{item.description}}</div>
    </mat-list-item>
    } @empty {

    }
</mat-list>
